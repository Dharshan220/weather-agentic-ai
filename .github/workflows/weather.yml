name: Weather Agent Pipeline

on:
  schedule:
    # 7:00 AM Asia/Kolkata (IST, UTC+5:30) == 01:30 UTC.
    # 07:00 - 05:30 = 01:30 -> cron minute=30, hour=1.
    - cron: '30 1 * * *'
    # 9:00 PM Asia/Kolkata (IST, UTC+5:30) == 15:30 UTC.
    # 21:00 - 05:30 = 15:30 -> cron minute=30, hour=15.
    - cron: '30 15 * * *'
  workflow_dispatch:

env:
  # --- LLM provider (OpenAI-compatible API) ---
  LLM_PROVIDER: google
  LLM_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
  LLM_MODEL: gemini-3.6-flash
  LLM_TEMPERATURE: '0.2'
  LLM_TIMEOUT_SECONDS: '120'

  # --- Locations to monitor ---
  WEATHER_LOCATIONS: '[{"name":"Chennai","lat":13.0827,"lon":80.2707},{"name":"Bengaluru","lat":12.9716,"lon":77.5946,"use_llm":false}]'

  # --- Risk thresholds ---
  RAIN_MM_THRESHOLD: '20'
  HEAT_C_THRESHOLD: '35'
  WIND_KMH_THRESHOLD: '40'
  ALERT_THRESHOLD: HIGH
  ALERT_COOLDOWN_HOURS: '6'

  # --- Email (SMTP). Leave SMTP_ENABLED false unless secrets are configured. ---
  SMTP_ENABLED: ${{ secrets.SMTP_ENABLED || 'false' }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  SMTP_FROM: ${{ secrets.SMTP_FROM }}
  ALERT_TO: ${{ secrets.ALERT_TO }}

  # --- Daily summary email ---
  DAILY_SUMMARY_ENABLED: 'true'
  DAILY_SUMMARY_TIMES: '07:00,21:00'
  TIMEZONE: Asia/Kolkata

  # --- App ---
  APP_HOST: 127.0.0.1
  APP_PORT: '8000'
  DB_PATH: weather.db

jobs:
  weather-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: hashFiles('requirements.txt') != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run weather agent pipeline
        run: |
          python - <<'EOF'
          import os

          from app.database import SessionLocal, init_db
          from app.models import AgentRun
          from app.orchestrator import run_all, run_daily_summary

          init_db()
          ids = run_all("scheduled")
          print(f"Pipeline runs completed: {len(ids)}")

          if os.environ.get("DAILY_SUMMARY_ENABLED", "false").lower() == "true":
              print("Daily summary enabled - sending summary email")
              run_daily_summary("daily")

          with SessionLocal() as db:
              failed = (
                  db.query(AgentRun)
                  .filter(AgentRun.status == "failed")
                  .count()
              )
          if failed:
              print(f"{failed} pipeline run(s) failed")
              raise SystemExit(1)
          print("Weather agent pipeline finished successfully")
          EOF